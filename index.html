
<!DOCTYPE html>
<html>
<head>
    <title>Weekly Meal Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Weekly Meal Planner</h1>
        <p class="subtitle">Plan your healthy meals for the week!</p>

        <div class="controls">
            <label>Select Day:</label>
            <select id="day">
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
                <option>Sunday</option>
            </select>

            <label>Select Meal:</label>
            <select id="mealType">
                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
            </select>

            <label>Enter Meal:</label>
            <input type="text" id="mealInput"
                   placeholder="Enter your meal">

            <button onclick="addMeal()">Add / Replace Meal</button>
            <button onclick="removeMeal()" class="remove">
                Remove Meal
            </button>
        </div>

        <h2>Weekly Schedule</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Day</th>
                        <th>Breakfast</th>
                        <th>Lunch</th>
                        <th>Dinner</th>
                    </tr>
                </thead>

                <tbody id="mealTable">
                </tbody>
            </table>
        </div>

        <div class="count-box">
            <h3>Filled Meal Slots</h3>
            <p id="count">0 / 21</p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
